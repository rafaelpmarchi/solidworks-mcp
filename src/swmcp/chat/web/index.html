<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Claude — SolidWorks</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #26272b; --border: #3a3b40;
    --text: #e6e4df; --dim: #9b9891; --accent: #d97757; --tool: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 "Segoe UI", sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  header b { font-size: 13px; }
  header button { margin-left: auto; background: none; border: 1px solid var(--border);
                  color: var(--dim); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  header button:hover { color: var(--text); }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin-bottom: 10px; max-width: 100%; white-space: pre-wrap;
         word-wrap: break-word; border-radius: 8px; padding: 8px 10px; }
  .user { background: #33342f; border: 1px solid var(--border); }
  .bot  { background: var(--panel); border: 1px solid var(--border); }
  .tool { color: var(--tool); font-size: 12px; padding: 2px 10px; }
  .err  { background: #3a2626; border: 1px solid #5c3535; color: #e8a9a9; }
  .thinking { color: var(--dim); font-style: italic; padding: 2px 10px; }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
         flex-shrink: 0; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text);
             border: 1px solid var(--border); border-radius: 8px; padding: 8px;
             font: inherit; height: 60px; }
  textarea:focus { outline: 1px solid var(--accent); }
  form button { background: var(--accent); color: #fff; border: none; border-radius: 8px;
                padding: 0 16px; cursor: pointer; font: inherit; }
  form button:disabled { opacity: .5; cursor: default; }
  code { background: #1a1a1d; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="var(--accent)">
      <circle cx="50" cy="50" r="7"/>
      <g id="raio"><polygon points="50,50 44,48 50,4 56,48"/></g>
      <use href="#raio" transform="rotate(30 50 50)"/>
      <use href="#raio" transform="rotate(60 50 50)"/>
      <use href="#raio" transform="rotate(90 50 50)"/>
      <use href="#raio" transform="rotate(120 50 50)"/>
      <use href="#raio" transform="rotate(150 50 50)"/>
      <use href="#raio" transform="rotate(180 50 50)"/>
      <use href="#raio" transform="rotate(210 50 50)"/>
      <use href="#raio" transform="rotate(240 50 50)"/>
      <use href="#raio" transform="rotate(270 50 50)"/>
      <use href="#raio" transform="rotate(300 50 50)"/>
      <use href="#raio" transform="rotate(330 50 50)"/>
    </g>
  </svg>
  <b>Claude · SolidWorks</b>
  <button id="reset" title="Limpar conversa">limpar</button></header>
<div id="log">
  <div class="msg bot">Olá! Estou dentro do SolidWorks. Posso ver o que está aberto
(<code>status</code>), ler um desenho por completo, revisar com as regras da Gromar
ou consultar propriedades de peça. O que você precisa?</div>
</div>
<form id="form">
  <textarea id="input" placeholder="Ex.: revise o desenho ativo… (Enter envia, Shift+Enter quebra linha)"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

function add(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function toolLabel(name, inp) {
  const alvo = inp && inp.path ? " — " + inp.path.split("\\").pop() : "";
  const nomes = {sw_status: "consultando o SolidWorks",
                 get_drawing_dump: "lendo o desenho",
                 get_model_properties: "lendo o modelo 3D",
                 review_drawing: "revisando o desenho"};
  return "⚙ " + (nomes[name] || name) + alvo;
}

async function submit(ev) {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  add("user", text);
  send.disabled = true;
  const pensando = add("thinking", "pensando…");
  try {
    const resp = await fetch("/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})});
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        pensando.remove();
        if (ev.type === "text") add("bot", ev.text);
        else if (ev.type === "tool") add("tool", toolLabel(ev.name, ev.input));
        else if (ev.type === "error") add("err", ev.text);
      }
    }
  } catch (e) {
    pensando.remove();
    add("err", "Sem conexão com o backend do chat (" + e.message + "). " +
        "Ele roda junto com o add-in; reative o add-in ou rode `python -m swmcp.chat`.");
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", submit);
input.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); form.requestSubmit(); }
});
document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/reset", {method: "POST"});
  log.innerHTML = "";
  add("bot", "Conversa limpa. Em que posso ajudar?");
});
input.focus();
</script>
</body>
</html>
